<svg fill="none" viewBox="0 0 950 250" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#f778ba" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f778ba" stop-opacity="0.15" />
    </linearGradient>

    <!-- Filters for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#primary-grad);
    }
    .pronouns {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #8b949e;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      font-weight: 500;
      fill: #c9d1d9;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e6edf3;
      letter-spacing: 0.3px;
    }
    .grid-line {
      stroke: #30363d;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="950" height="250" rx="16" fill="url(#bg-grad)" />
  <rect width="948" height="248" x="1" y="1" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="50" x2="950" y2="50" />
    <line x1="0" y1="100" x2="950" y2="100" />
    <line x1="0" y1="150" x2="950" y2="150" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="450" y1="0" x2="450" y2="250" />
    <line x1="600" y1="0" x2="600" y2="250" />
    <line x1="750" y1="0" x2="750" y2="250" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="80" fill="#58a6ff" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="190" r="90" fill="#8a2be2" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Decorative Wave Curves at Bottom -->
  <path d="M 0 190 Q 240 140 475 190 T 950 180 L 950 250 L 0 250 Z" fill="url(#wave-grad)" />
  <path d="M 0 215 Q 230 185 475 220 T 950 210 L 950 250 L 0 250 Z" fill="#0d1117" fill-opacity="0.7" />

  <!-- Top Accent Banner Line -->
  <rect x="30" y="22" width="60" height="4" rx="2" fill="url(#primary-grad)" />

  <!-- Header: Sharique Hussain -->
  <g transform="translate(475, 75)" text-anchor="middle">
    <text x="0" y="0" class="title">Sharique Hussain</text>
  </g>

  <!-- Pronouns Badge -->
  <g transform="translate(475, 105)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="0" y="1" class="pronouns" text-anchor="middle" dominant-baseline="middle">He / Him</text>
  </g>

  <!-- Primary Tagline -->
  <g transform="translate(475, 142)" text-anchor="middle">
    <text x="0" y="0" class="tagline">Engineer of Ideas <tspan fill="#58a6ff">•</tspan> Traveler in Learning</text>
  </g>

  <!-- Interactive Role Pills Row -->
  <g transform="translate(475, 185)">
    <!-- Pill 1: AI Engineer -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="125" height="30" rx="15" fill="url(#pill-bg)" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#58a6ff" />
      <text x="70" y="19" class="pill-text" text-anchor="middle">AI Engineer</text>
    </g>

    <!-- Pill 2: DevOps Engineer -->
    <g transform="translate(-215, 0)">
      <rect x="0" y="0" width="145" height="30" rx="15" fill="url(#pill-bg)" stroke="#a371f7" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#a371f7" />
      <text x="78" y="19" class="pill-text" text-anchor="middle">DevOps Engineer</text>
    </g>

    <!-- Pill 3: Full-Stack Developer -->
    <g transform="translate(-50, 0)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="url(#pill-bg)" stroke="#38ef7d" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#38ef7d" />
      <text x="85" y="19" class="pill-text" text-anchor="middle">Full-Stack Dev</text>
    </g>

    <!-- Pill 4: Cloud Computing -->
    <g transform="translate(130, 0)">
      <rect x="0" y="0" width="145" height="30" rx="15" fill="url(#pill-bg)" stroke="#f778ba" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#f778ba" />
      <text x="80" y="19" class="pill-text" text-anchor="middle">Cloud Computing</text>
    </g>

    <!-- Pill 5: Problem Solver -->
    <g transform="translate(295, 0)">
      <rect x="0" y="0" width="135" height="30" rx="15" fill="url(#pill-bg)" stroke="#f1e05a" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#f1e05a" />
      <text x="75" y="19" class="pill-text" text-anchor="middle">Problem Solver</text>
    </g>
  </g>
</svg>
